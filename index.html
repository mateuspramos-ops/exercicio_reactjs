<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de IMC — React</title>

  <!-- React 18 via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── Card principal ── */
    .card {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 48px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* ── Header do card ── */
    .card-header {
      background: #0f172a;
      padding: 2rem 2rem 1.8rem;
      text-align: center;
    }

    .card-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
    }

    .card-header p {
      font-size: 0.82rem;
      color: #64748b;
      font-weight: 400;
    }

    /* ── Corpo do card ── */
    .card-body { padding: 2rem; }

    /* ── Campos ── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.2rem;
    }

    label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #475569;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="number"] {
      width: 100%;
      padding: 0.8rem 3.5rem 0.8rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

    input[type="number"]:focus {
      border-color: #6366f1;
      background: #ffffff;
    }

    .input-unit {
      position: absolute;
      right: 1rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      pointer-events: none;
    }

    .input-hint {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }

    /* ── Resultado ── */
    .result {
      margin-top: 1.8rem;
      border-radius: 14px;
      padding: 1.8rem;
      text-align: center;
      border: 2px solid transparent;
      transition: all 0.35s ease;
    }

    .result--empty {
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    .result--magro       { background: #eff6ff; border-color: #93c5fd; }
    .result--normal      { background: #f0fdf4; border-color: #86efac; }
    .result--sobrepeso   { background: #fffbeb; border-color: #fcd34d; }
    .result--obesidade1  { background: #fff7ed; border-color: #fdba74; }
    .result--obesidade2  { background: #fef2f2; border-color: #fca5a5; }
    .result--obesidade3  { background: #fdf2f8; border-color: #f0abfc; }

    .result__label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 0.6rem;
    }

    .result__value {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 0.5rem;
      transition: color 0.35s;
    }

    .result--empty       .result__value { color: #cbd5e1; }
    .result--magro       .result__value { color: #3b82f6; }
    .result--normal      .result__value { color: #22c55e; }
    .result--sobrepeso   .result__value { color: #f59e0b; }
    .result--obesidade1  .result__value { color: #f97316; }
    .result--obesidade2  .result__value { color: #ef4444; }
    .result--obesidade3  .result__value { color: #a855f7; }

    .result__class {
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.3rem;
    }

    .result__desc {
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.5;
    }

    /* ── Barra de progresso ── */
    .progress-bar {
      margin-top: 1.2rem;
      height: 6px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar__fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.5s ease, background 0.35s ease;
    }

    /* ── Tabela IMC ── */
    .table-section {
      margin-top: 1.8rem;
      border-top: 1px solid #f1f5f9;
      padding-top: 1.5rem;
    }

    .table-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 0.8rem;
    }

    .table-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      font-size: 0.82rem;
      transition: background 0.2s;
    }

    .table-row--active {
      font-weight: 600;
    }

    .table-row__range { color: #64748b; font-size: 0.75rem; }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-right: 0.6rem;
    }

    .table-row__left { display: flex; align-items: center; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // ── Tabela de classificação IMC ──
    const TABELA = [
      { key: 'magro',      label: 'Abaixo do peso', range: '< 18,5',        min: 0,    max: 18.5,  cor: '#3b82f6', bg: '#eff6ff', classe: 'result--magro'      },
      { key: 'normal',     label: 'Peso normal',    range: '18,5 – 24,9',   min: 18.5, max: 25,    cor: '#22c55e', bg: '#f0fdf4', classe: 'result--normal'     },
      { key: 'sobrepeso',  label: 'Sobrepeso',      range: '25,0 – 29,9',   min: 25,   max: 30,    cor: '#f59e0b', bg: '#fffbeb', classe: 'result--sobrepeso'  },
      { key: 'obesidade1', label: 'Obesidade I',    range: '30,0 – 34,9',   min: 30,   max: 35,    cor: '#f97316', bg: '#fff7ed', classe: 'result--obesidade1' },
      { key: 'obesidade2', label: 'Obesidade II',   range: '35,0 – 39,9',   min: 35,   max: 40,    cor: '#ef4444', bg: '#fef2f2', classe: 'result--obesidade2' },
      { key: 'obesidade3', label: 'Obesidade III',  range: '≥ 40,0',        min: 40,   max: Infinity, cor: '#a855f7', bg: '#fdf2f8', classe: 'result--obesidade3' },
    ];

    function classificarIMC(imc) {
      return TABELA.find(t => imc >= t.min && imc < t.max) || null;
    }

    function calcularProgresso(imc) {
      // escala de 0 a 45 → 0% a 100%
      return Math.min(Math.max((imc / 45) * 100, 0), 100);
    }

    // ── Componente principal ──
    function App() {
      const [altura, setAltura] = useState('');
      const [peso,   setPeso]   = useState('');

      const imc = useMemo(() => {
        const a = parseFloat(altura);
        const p = parseFloat(peso);
        if (!a || !p || a <= 0 || p <= 0) return null;
        const alturaM = a / 100; // converte cm para m
        return p / (alturaM * alturaM);
      }, [altura, peso]);

      const classificacao = imc ? classificarIMC(imc) : null;
      const progresso     = imc ? calcularProgresso(imc) : 0;

      return (
        <div className="card">

          {/* Header */}
          <div className="card-header">
            <h1>Calculadora de IMC</h1>
            <p>Índice de Massa Corporal · React.js</p>
          </div>

          <div className="card-body">

            {/* Campo Altura */}
            <div className="field">
              <label htmlFor="altura">Altura</label>
              <div className="input-wrap">
                <input
                  id="altura"
                  type="number"
                  placeholder="Ex: 175"
                  value={altura}
                  onChange={e => setAltura(e.target.value)}
                  min="1"
                  max="300"
                />
                <span className="input-unit">cm</span>
              </div>
              <span className="input-hint">Digite em centímetros (ex: 175)</span>
            </div>

            {/* Campo Peso */}
            <div className="field">
              <label htmlFor="peso">Peso</label>
              <div className="input-wrap">
                <input
                  id="peso"
                  type="number"
                  placeholder="Ex: 70"
                  value={peso}
                  onChange={e => setPeso(e.target.value)}
                  min="1"
                  max="500"
                />
                <span className="input-unit">kg</span>
              </div>
              <span className="input-hint">Digite em quilogramas (ex: 70)</span>
            </div>

            {/* Resultado */}
            <div className={`result ${classificacao ? classificacao.classe : 'result--empty'}`}>
              <p className="result__label">Seu IMC</p>
              <div className="result__value">
                {imc ? imc.toFixed(1) : '—'}
              </div>
              <div className="result__class">
                {classificacao ? classificacao.label : 'Preencha os campos acima'}
              </div>
              <div className="result__desc">
                {classificacao
                  ? `Faixa: ${classificacao.range} kg/m²`
                  : 'O resultado aparecerá aqui automaticamente'}
              </div>

              {/* Barra de progresso */}
              <div className="progress-bar">
                <div
                  className="progress-bar__fill"
                  style={{
                    width: `${progresso}%`,
                    background: classificacao ? classificacao.cor : '#e2e8f0'
                  }}
                />
              </div>
            </div>

            {/* Tabela de classificação */}
            <div className="table-section">
              <p className="table-title">Tabela de Classificação</p>
              {TABELA.map(item => {
                const ativo = classificacao?.key === item.key;
                return (
                  <div
                    key={item.key}
                    className={`table-row ${ativo ? 'table-row--active' : ''}`}
                    style={{ background: ativo ? item.bg : 'transparent' }}
                  >
                    <div className="table-row__left">
                      <div className="dot" style={{ background: item.cor }} />
                      {item.label}
                    </div>
                    <span className="table-row__range">{item.range}</span>
                  </div>
                );
              })}
            </div>

          </div>
        </div>
      );
    }

    // ── Monta o app ──
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
